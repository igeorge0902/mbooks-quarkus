# --- DataSource configuration ---
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=sqluser
quarkus.datasource.password=sqluserpw
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/book
quarkus.datasource.jdbc.driver=com.mysql.cj.jdbc.Driver

# --- Hibernate ORM ---
# none or "update" if you want it to create tables
quarkus.hibernate-orm.dialect=org.hibernate.dialect.MySQLDialect
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.format-sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.statistics=true

# --- C3P0-like connection pool settings (Quarkus uses Agroal) ---
# These are Agroal equivalents of your C3P0 settings
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.initial-size=5
quarkus.datasource.idle-removal-interval=300s  # test every 5 min
quarkus.datasource.jdbc.acquisition-timeout=30s

# --- Hibernate SQL ---
quarkus.log.handler.file.hibernate_sql_file.enable=true
quarkus.log.handler.file.hibernate_sql_file.path=log/hibernate-sql.log
quarkus.log.handler.file.hibernate_sql_file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] - %s%e%n

quarkus.log.category."org.hibernate.SQL".handlers=hibernate_sql_file
quarkus.log.category."org.hibernate.SQL".level=DEBUG
quarkus.log.category."org.hibernate.SQL".use-parent-handlers=false


# --- Hibernate Bind Parameters ---
quarkus.log.handler.file.hibernate_bind_file.enable=true
quarkus.log.handler.file.hibernate_bind_file.path=log/hibernate-bind.log
quarkus.log.handler.file.hibernate_bind_file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] - %s%e%n

quarkus.log.category."org.hibernate.orm.jdbc.bind".handlers=hibernate_bind_file
quarkus.log.category."org.hibernate.orm.jdbc.bind".level=TRACE
quarkus.log.category."org.hibernate.orm.jdbc.bind".use-parent-handlers=false


# --- Hibernate Transactions ---
quarkus.log.handler.file.hibernate_transaction_file.enable=true
quarkus.log.handler.file.hibernate_transaction_file.path=log/hibernate-transaction.log
quarkus.log.handler.file.hibernate_transaction_file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] - %s%e%n

quarkus.log.category."org.hibernate.transaction".handlers=hibernate_transaction_file
quarkus.log.category."org.hibernate.transaction".level=DEBUG
quarkus.log.category."org.hibernate.transaction".use-parent-handlers=false


# --- Hibernate Cache ---
quarkus.log.handler.file.hibernate_cache_file.enable=true
quarkus.log.handler.file.hibernate_cache_file.path=log/hibernate-cache.log
quarkus.log.handler.file.hibernate_cache_file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] - %s%e%n

quarkus.log.category."org.hibernate.cache".handlers=hibernate_cache_file
quarkus.log.category."org.hibernate.cache".level=DEBUG
quarkus.log.category."org.hibernate.cache".use-parent-handlers=false

# --- Your JAX-RS root path ---
quarkus.http.root-path=/mbooks-1
quarkus.kafka.devservices.enabled=false
#quarkus.hibernate-search-orm.elasticsearch.version=8

# --- OpenTelemetry ---
quarkus.otel.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.traces.exporter=otlp
quarkus.otel.service.name=mbooks-quarkus
quarkus.otel.traces.sampler=parentbased_always_on

# --- Observability logging category file routing (ObservedLog interceptor) ---
quarkus.log.handler.file.entity_file.enable=true
quarkus.log.handler.file.entity_file.path=log/entity.log
quarkus.log.handler.file.entity_file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] - %s%e%n
quarkus.log.category."LOG-ENTITY".handlers=entity_file
quarkus.log.category."LOG-ENTITY".level=DEBUG
quarkus.log.category."LOG-ENTITY".use-parent-handlers=false
quarkus.log.handler.file.hibernate_tx_file.enable=true
quarkus.log.handler.file.hibernate_tx_file.path=log/hibernate-tx.log
quarkus.log.handler.file.hibernate_tx_file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] - %s%e%n
quarkus.log.category."LOG-HIBERNATE-TX".handlers=hibernate_tx_file
quarkus.log.category."LOG-HIBERNATE-TX".level=INFO
quarkus.log.category."LOG-HIBERNATE-TX".use-parent-handlers=false

# Entities (Quarkus auto-discovers, but can be explicit)
# Quarkus scans automatically.
# If you want to restrict scanning to a specific package:
# quarkus.hibernate-orm.packages=com.jeet.api,com.jeet.broadcasting.eventModel
