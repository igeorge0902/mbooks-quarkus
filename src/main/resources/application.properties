# --- DataSource configuration ---
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=sqluser
quarkus.datasource.password=sqluserpw
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/book

# (Optional) Connection pool tuning
quarkus.datasource.jdbc.max-size=16

# --- Hibernate ORM ---
# none or "update" if you want it to create tables
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true

# --- Your JAX-RS root path ---
quarkus.http.root-path=/mbooks-1
quarkus.kafka.devservices.enabled=false
quarkus.hibernate-search-orm.elasticsearch.version=8

# --- OpenTelemetry ---
quarkus.otel.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.traces.exporter=otlp
quarkus.otel.service.name=mbooks-quarkus
quarkus.otel.traces.sampler=parentbased_always_on
# --- Observability logging category file routing (ObservedLog / DAOLogger) ---
# Each log category maps to a separate file per speckit.system.backend-logging-observability
quarkus.log.handler.file.entity_file.enable=true
quarkus.log.handler.file.entity_file.path=entity.log
quarkus.log.handler.file.entity_file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] - %s%e%n
quarkus.log.category."LOG-ENTITY".handlers=entity_file
quarkus.log.category."LOG-ENTITY".level=DEBUG
quarkus.log.category."LOG-ENTITY".use-parent-handlers=false
quarkus.log.handler.file.hibernate_tx_file.enable=true
quarkus.log.handler.file.hibernate_tx_file.path=hibernate-tx.log
quarkus.log.handler.file.hibernate_tx_file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] - %s%e%n
quarkus.log.category."LOG-HIBERNATE-TX".handlers=hibernate_tx_file
quarkus.log.category."LOG-HIBERNATE-TX".level=INFO
quarkus.log.category."LOG-HIBERNATE-TX".use-parent-handlers=false
